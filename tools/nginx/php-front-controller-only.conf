# Only the front controller (index.php) may run PHP. Uploaded scripts never execute.
# Use it inside each Laravel/Symfony server { } block, INSTEAD OF a generic "location ~ \.php$" block:
#
#     include /etc/nginx/snippets/php-front-controller-only.conf;
#
# Edit the fastcgi_pass line to match your php-fpm socket (see "listen =" in your pool file).
# Not for WordPress or other apps that serve many .php files.

location ~* ^(?!/index\.php$).*\.(php[0-9]?|phtml?|pht|phar|shtml|pgif)$ {
    return 404;
}

location ~ ^/index\.php$ {
    include fastcgi_params;
    fastcgi_pass unix:/run/php-fpm/www.sock;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
}

# Never serve dotfiles (.env, .git, .htaccess...), except Let's Encrypt's .well-known
location ~ /\.(?!well-known).* {
    deny all;
}
