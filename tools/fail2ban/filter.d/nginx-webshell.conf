# Webshell / exploit probes (PHP2Shell, Livewire upload RCE, scanners).
# Matches the nginx "main" log format: <ip> - <user> [<time>] "<METHOD> <uri> <proto>" <status> ...

[Definition]

_req = ^<HOST> \S+ \S+ \[[^\]]*\] "[A-Z]+

failregex = %(_req)s (?!/index\.php[ ?])[^" ?]*\.(?i:php[0-9]?|phtml?|pht|phar|shtml|pgif)(?:%%20|\.)?(?:\?[^" ]*)? HTTP
            %(_req)s [^" ]*[?&]x=(?:id|echo|whoami|uname|wget|curl|cat|ls|pwd)\b
            %(_req)s [^" ]*(?i:fx1337)
            %(_req)s [^" ]*livewire-tmp
            %(_req)s /(?:wire|api/livewire|public/livewire|index\.php/livewire)/
            %(_req)s /livewire/message
            %(_req)s /(?:[^" ]*/)?(?i:\.env|\.git/|wp-login|wp-admin|xmlrpc|phpmyadmin|vendor/phpunit|cgi-bin/|_ignition/|_debugbar/|_profiler/|aws-exports\.js)

ignoreregex =

datepattern = ^[^\[]*\[({DATE})
              {^LN-BEG}
