# fail2ban action: deny the IP in nginx.
# Works for visitors behind Cloudflare too, because nginx resolves the real IP
# (tools/nginx/cloudflare-realip.sh). The file survives restarts.

[Definition]

actionstart = touch <blocklist>

actionstop =

actioncheck =

actionflush =

actionban = grep -qxF 'deny <ip>;' <blocklist> || echo 'deny <ip>;' >> <blocklist>
            nginx -t -q && systemctl reload nginx || { sed -i '\#^deny <ip>;$#d' <blocklist>; exit 1; }

actionunban = sed -i '\#^deny <ip>;$#d' <blocklist>
              nginx -t -q && systemctl reload nginx

[Init]

blocklist = /etc/nginx/conf.d/00-blocklist-auto.conf
